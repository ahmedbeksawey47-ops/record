<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة المحاضرات المسجلة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            padding: 35px 20px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        .header h1 {
            font-size: 34px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p {
            color: #94a3b8;
            font-size: 16px;
        }
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 35px;
        }
        .filter-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
        }
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1150px;
            margin: 0 auto;
        }
        .video-card {
            background: #1e293b;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: 0.35s;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
        }
        .video-card:hover {
            transform: translateY(-6px);
            border-color: #38bdf8;
            box-shadow: 0 18px 35px rgba(56, 189, 248, 0.18);
        }
        .video-frame {
            width: 100%;
            height: 215px;
            background: #020617;
        }
        .video-frame video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .video-info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .course-tag {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
            width: fit-content;
        }
        .video-title {
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 مكتبة المحاضرات المسجلة</h1>
        <p>شاهد وراجع جميع المحاضرات المسجلة في أي وقت</p>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterVideos('الكل', this)">الكل</button>
        <button class="filter-btn" onclick="filterVideos('كورس البايثون', this)">🐍 كورس البايثون</button>
        <button class="filter-btn" onclick="filterVideos('صناعة الألعاب', this)">🎮 صناعة الألعاب</button>
    </div>

    <div class="videos-grid" id="videosContainer"></div>

    <script>
        /* =========================================================
           حط مسار الفيديو أو اسمه هنا بنفس الشكل
           ملاحظة: استخدم علامة / بدل \ علشان الكود ميعملش خطأ
        ========================================================= */
        const videos = [
           {
            title: "المحاضرة 1:ازاي اصطب الملف بتاع بايثون",
                category: "كورس البايثون",
                url: "c:/Users/HP/Videos/Captures/New Tab - Google Chrome 2026-11-26 20-17-07.mp4"
          }
          ,{ 
                title: "المحاضرة 2: عمل اول مشروع  ",
                category: "كورس البايثون",
                url: "c:/Users/HP/Videos/Captures/● lesson-1.py - malek - Visual Studio Code 2026-11-26 19-58-48.mp4"
            }
            // لإضافة فيديو تاني انسخ الجزء ده وحطه بعد الفاصلة:
            // ,{
            //     title: "المحاضرة 2: تكملة الشرح",
            //     category: "صناعة الألعاب",
            //     url: "اسم_الفيديو.mp4"
            // }
        ];

        function fixLocalPath(path) {
            // تحويل أي \ لـ / لو اتكتبت بالغلط
            let cleanPath = path.replace(/\\/g, "/");
            // لو المسار يبدأ بـ C:/ نحوله لصيغة file:/// علشان المتصفح يفتحه
            if (/^[a-zA-Z]:\//.test(cleanPath)) {
                return "file:///" + encodeURI(cleanPath);
            }
            return encodeURI(cleanPath);
        }

        function renderVideos(selectedCategory = "الكل") {
            const container = document.getElementById("videosContainer");
            container.innerHTML = "";

            const filtered = selectedCategory === "الكل"
                ? videos
                : videos.filter(vid => vid.category === selectedCategory);

            filtered.forEach(vid => {
                const videoSrc = fixLocalPath(vid.url);
                container.innerHTML += `
                    <div class="video-card">
                        <div class="video-frame">
                            <video controls preload="metadata">
                                <source src="${videoSrc}" type="video/mp4">
                                متصفحك لا يدعم تشغيل الفيديو.
                            </video>
                        </div>
                        <div class="video-info">
                            <div>
                                <span class="course-tag">${vid.category}</span>
                                <h3 class="video-title">${vid.title}</h3>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterVideos(category, btnElement) {
            document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
            btnElement.classList.add("active");
            renderVideos(category);
        }

        renderVideos();
    </script>

</body>
</html>
