<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاضرات Costa Code | الموقع التاني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0f19; --card: #131b2e; --primary: #3b82f6; --accent: #06b6d4; --text: #f8fafc; --muted: #94a3b8; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }
        header { background: rgba(19, 27, 46, 0.92); backdrop-filter: blur(10px); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 1.7rem; font-weight: 900; background: linear-gradient(45deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-pill { color: var(--success); font-size: 0.9rem; font-weight: 700; }
        .container { max-width: 1150px; margin: 30px auto; padding: 0 5%; }
        .hero-sub { text-align: center; margin-bottom: 25px; }
        .hero-sub h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 8px; }
        .hero-sub p { color: var(--muted); }
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn { background: var(--card); color: var(--text); border: 2px solid #1e293b; padding: 12px 26px; border-radius: 12px; font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: 0.25s; }
        .tab-btn.active { background: linear-gradient(45deg, var(--primary), var(--accent)); border-color: transparent; color: #fff; }
        .interface-panel { display: none; }
        .interface-panel.active { display: block; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #1e293b; flex-wrap: wrap; gap: 10px; }
        .panel-header h2 { color: var(--accent); font-size: 1.6rem; font-weight: 800; }
        .count-badge { background: #1e293b; color: #e2e8f0; padding: 5px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; }
        .videos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px; }
        .video-card { background: var(--card); border: 1px solid #1e293b; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
        .player-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .player-box iframe, .player-box video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-info { padding: 18px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .video-info h3 { font-size: 1.15rem; color: #fff; margin-bottom: 8px; }
        .video-info p { color: var(--muted); font-size: 0.92rem; margin-bottom: 12px; }
        .ext-link { color: var(--accent); text-decoration: none; font-size: 0.88rem; font-weight: 700; }
        .empty-msg { background: var(--card); border: 1px dashed #334155; border-radius: 14px; padding: 35px; text-align: center; color: var(--muted); font-size: 1.05rem; }
    </style>
</head>
<body>
<header>
    <div class="logo">COSTA CODE • المحاضرات</div>
    <span class="status-pill">● متصل بالموقع الرابع (Realtime DB)</span>
</header>
<div class="container">
    <div class="hero-sub">
        <h1>منصة فيديوهات الكورس</h1>
        <p>اختر الواجهة المطلوبة لمشاهدة الدروس والمحاضرات التي تم رفعها</p>
    </div>
    <div class="tabs">
        <button class="tab-btn active" id="btn-python" onclick="switchInterface('python')">🐍 واجهة بايثون (Python)</button>
        <button class="tab-btn" id="btn-godot" onclick="switchInterface('godot')">🎮 واجهة الألعاب (Godot)</button>
    </div>
    <section class="interface-panel active" id="panel-python">
        <div class="panel-header">
            <h2>🐍 واجهة كورس بايثون (Python)</h2>
            <span class="count-badge" id="python-count">0 فيديو</span>
        </div>
        <div class="videos-grid" id="python-videos"><p class="empty-msg">جاري تحميل فيديوهات بايثون...</p></div>
    </section>
    <section class="interface-panel" id="panel-godot">
        <div class="panel-header">
            <h2>🎮 واجهة كورس صناعة الألعاب (Godot)</h2>
            <span class="count-badge" id="godot-count">0 فيديو</span>
        </div>
        <div class="videos-grid" id="godot-videos"><p class="empty-msg">جاري تحميل فيديوهات صناعة الألعاب...</p></div>
    </section>
</div>
<script>
    function switchInterface(track) {
        document.getElementById("btn-python").classList.toggle("active", track === "python");
        document.getElementById("btn-godot").classList.toggle("active", track === "godot");
        document.getElementById("panel-python").classList.toggle("active", track === "python");
        document.getElementById("panel-godot").classList.toggle("active", track === "godot");
    }
</script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "costa-code.firebaseapp.com",
        databaseURL: "https://costa-code-default-rtdb.firebaseio.com",
        projectId: "costa-code",
        storageBucket: "costa-code.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function renderVideoCard(v) {
        const playerHtml = v.playerType === "video"
            ? `<video src="${v.embedUrl}" controls preload="metadata"></video>`
            : `<iframe src="${v.embedUrl}" allowfullscreen loading="lazy"></iframe>`;
        return `
            <div class="video-card">
                <div class="player-box">${playerHtml}</div>
                <div class="video-info">
                    <div>
                        <h3>${v.title}</h3>
                        ${v.description ? `<p>${v.description}</p>` : ""}
                    </div>
                    <a class="ext-link" href="${v.originalUrl}" target="_blank" rel="noopener">فتح الفيديو في نافذة جديدة ↗</a>
                </div>
            </div>
        `;
    }

    onValue(ref(db, "videos"), (snapshot) => {
        const raw = snapshot.val();
        const allVideos = raw ? Object.values(raw).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")) : [];
        const pythonList = allVideos.filter(v => v.track !== "godot");
        const godotList = allVideos.filter(v => v.track === "godot");

        document.getElementById("python-count").innerText = `${pythonList.length} فيديو`;
        document.getElementById("godot-count").innerText = `${godotList.length} فيديو`;

        document.getElementById("python-videos").innerHTML = pythonList.length
            ? pythonList.map(renderVideoCard).join("")
            : `<div class="empty-msg">لا يوجد فيديوهات مضافة في واجهة بايثون حالياً.</div>`;

        document.getElementById("godot-videos").innerHTML = godotList.length
            ? godotList.map(renderVideoCard).join("")
            : `<div class="empty-msg">لا يوجد فيديوهات مضافة في واجهة الألعاب (Godot) حالياً.</div>`;
    });
</script>
</body>
</html>
